    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename you-lab-at-ub.html to index.html
        run: |
          git config user.name "yj7107"
          git config user.email "yj7107@users.noreply.github.com"
          git mv you-lab-at-ub.html index.html
          git commit -m "Rename you-lab-at-ub.html to index.html"
          git push
